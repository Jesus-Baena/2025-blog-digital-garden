name: Translate to Spanish

# When English content changes on main, draft the missing or stale Spanish
# translations with Claude and open a pull request for review. Nothing is
# merged automatically. Requires the ANTHROPIC_API_KEY repository secret;
# without it the job logs a warning and does nothing.

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "!content/es/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Find missing or stale translations
        id: status
        run: |
          node scripts/translation-status.mjs | tail -1
          if node scripts/translate.mjs --dry-run | grep -q '^Nothing to translate'; then
            echo "todo=false" >> "$GITHUB_OUTPUT"
          else
            echo "todo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Translate with Claude
        if: steps.status.outputs.todo == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set; translations were not generated."
            exit 0
          fi
          node scripts/translate.mjs
          node scripts/lint-frontmatter.mjs

      - name: Open a pull request with the drafts
        if: steps.status.outputs.todo == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: translations/spanish
          delete-branch: true
          title: "Spanish translations (Claude drafts)"
          commit-message: "content(es): Spanish translation drafts"
          labels: translation
          body: |
            Draft Spanish translations generated by `scripts/translate.mjs` for notes whose
            English source is new or changed. Read them before merging; edit in place if needed.

            After merging, `npm run translations` reports every note as current.
